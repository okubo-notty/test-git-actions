name: My First Workflow with YAML Lint


on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main


jobs:
  lint:
    name: YAML Lint
    runs-on: ubunto-latest
    steps:
      -name: Checkout repo
      uses: actions/checkout@v3

      -name: Run YAML Lint
      uses: rhysd/actionlint@v1
      with:
        args: .

  greet-job:
    name: Greet job
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Say Hello
        run: echo "Hello!! GitHub Actions! This is a test run."

